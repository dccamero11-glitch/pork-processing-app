<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งสินค้า</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="order.css"></head><body><header><div><h1>สั่งสินค้า</h1><p>จัดทำคำสั่งซื้อหมูและไก่</p><nav><a class="nav-link" href="/">บันทึกการแปรรูป</a><a class="nav-link active" href="/order.html">สั่งสินค้า</a><a class="nav-link" href="/order-history.html">ประวัติการสั่งสินค้า</a><a class="nav-link" href="/order-summary.html">สรุปการสั่งสินค้า</a><a class="nav-link" href="/price-comparison.html">เทียบราคาคู่แข่ง</a></nav></div></header><main><section class="card order-head"><div><span>วันที่ปัจจุบัน</span><strong id="orderDate">-</strong></div><div><span>ผู้ใช้งาน</span><strong id="orderedBy">-</strong></div><div><label>สาขา</label><select id="orderBranch"><option value="">เลือกสาขา</option><option>บางบัวทอง</option><option>หลังสวน</option><option>ตรัง</option></select></div></section><section class="order-layout"><div><section class="card"><h2>หมวดสินค้า</h2><div class="category-buttons"><button class="category-tab active" data-order-category="หมู">หมู</button><button class="category-tab" data-order-category="ไก่">ไก่</button></div></section><section class="card"><h2 id="orderCategoryTitle">รายการหมู</h2><div class="order-search"><input id="orderSearch" type="search" placeholder="ค้นหารายการหมู..."><button id="clearOrderSearch" class="secondary">ล้างการค้นหา</button></div><div class="order-table-wrap"><table class="order-table"><thead><tr><th>ลำดับ</th><th>รายการสินค้า</th><th>น้ำหนักที่สั่ง</th><th>หน่วย</th></tr></thead><tbody id="orderRows"></tbody></table></div><label>หมายเหตุรวม</label><textarea id="orderNote" maxlength="2000"></textarea></section></div><aside class="card order-summary"><h2>สรุปรายการสั่งซื้อ</h2><strong id="summaryBranch">กรุณาเลือกสาขา</strong><div id="orderSummary" class="empty">ยังไม่มีรายการ</div><div class="order-total"><span>น้ำห
