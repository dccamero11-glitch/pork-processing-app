<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งสินค้า</title><link rel="stylesheet" href="styles.css?v=20260827"><link rel="stylesheet" href="order.css?v=20260827"></head><body>
<header><div><h1>สั่งสินค้า</h1><p>จัดทำคำสั่งซื้อสำหรับแต่ละสาขา</p><nav><a class="nav-link" href="/">บันทึกการแปรรูป</a><a class="nav-link active" href="/order.html">สั่งสินค้า</a><a class="nav-link" href="/order-history.html">ประวัติการสั่งสินค้า</a><a class="nav-link" href="/price-comparison.html">เทียบราคาคู่แข่ง</a><a class="nav-link" href="/overview.html">สรุปภาพรวม</a><a class="nav-link" href="/price-history.html">ประวัติราคา</a></nav></div></header>
<main><section class="card order-head"><div><span>วันที่ปัจจุบัน</span><strong id="orderDate">-</strong></div><div><span>ผู้ใช้งาน</span><strong id="orderedBy">-</strong></div><div><label for="orderBranch">สาขาที่กำลังสั่ง</label><select id="orderBranch"><option value="">เลือกสาขา</option><option>บางบัวทอง</option><option>หลังสวน</option><option>ตรัง</option></select></div></section>
<section class="order-layout"><div><section class="card"><h2>หมวดสินค้า</h2><button class="category-tab active" type="button">หมู</button></section><section class="card"><h2>รายการหมู</h2><div class="order-table-wrap"><table class="order-table"><thead><tr><th>ลำดับ</th><th>รายการสินค้า</th><th>จำนวน/น้ำหนักที่สั่ง</th><th>หน่วย</th></tr></thead><tbody id="orderRows"></tbody></table></div><label for="orderNote">หมายเหตุรวม</label><textarea id="orderNote" maxlength="2000" placeholder="เช่น ขาหน้าขอน้ำหนักขาละ 1.70–1.90 กก. / ต้องการตัดแต่งพิเศษ / อื่นๆ"></textarea></section></div>
<aside class="card order-summary"><h2>สรุปรายการสั่งซื้อ</h2><strong id="summaryBranch">กรุณาเลือกสาขา</strong><div id="orderSummary" class="empty">ยังไม่มีรายการ</div><div class="order-total"><span>น้ำหนักรวมทั้งหมด</span><strong><span id="totalWeight">0.00</span> กก.</strong></div><div id="orderNotice"></div><div class="actions"><button id="clearOrder" class="secondary">ล้างข้อมูล</button><button id="saveOrder" class="primary">บันทึกคำสั่งซื้อ</button></div></aside></section></main>
<script src="auth.js?v=20260827"></script><script src="order.js?v=20260827"></script></body></html>
